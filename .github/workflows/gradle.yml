name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mouhamuh.looksmaxxiaI",
            "appName": "Looks Maxxi AI",
            "webDir": "dist"
          }
          EOF

      - name: Fix web assets
        run: |
          node -e "const fs=require('fs');const p='dist/index.html';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('src=\"/assets/','src=\"./assets/').replaceAll('href=\"/assets/','href=\"./assets/');fs.writeFileSync(p,s);"

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Looks-Maxxi-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
